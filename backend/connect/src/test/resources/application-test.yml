spring:
  main:
    banner-mode: off
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always

logging:
  level:
    org:
      springframework: WARN
      springframework.kafka: WARN
      testcontainers: WARN
      flywaydb: WARN
      hibernate: WARN
      apache:
        kafka: WARN
    root: WARN
    com:
      zaxxer:
        hikari: WARN
      github:
        dockerjava: WARN
    io:
      zonky:
        test:
          db:
            postgres:
              embedded: WARN