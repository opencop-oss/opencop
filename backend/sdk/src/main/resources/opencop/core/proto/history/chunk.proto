syntax = "proto3";

package history;

import "deckgl/elements.proto";

option java_outer_classname = "HistoricalChunkProtos";
option java_package = "opencop.core.proto.history";

enum HistoricalChunkResolution {
    HISTORICAL_CHUNK_RESOLUTION_UNKNOWN = 0;
    HISTORICAL_CHUNK_RESOLUTION_MINUTE_1 = 1;
    HISTORICAL_CHUNK_RESOLUTION_HOUR_1 = 2;
    HISTORICAL_CHUNK_RESOLUTION_DAY_1 = 3;
}

enum HistoricalChunkProfile {
    HISTORICAL_CHUNK_PROFILE_UNKNOWN = 0;
    HISTORICAL_CHUNK_PROFILE_DETAIL = 1;
}

message HistoricalChunkPayload {
    string chunk_key = 1;
    uint32 chunk_index = 2;
    uint64 from_epoch_millis = 3;
    uint64 to_epoch_millis = 4;
    HistoricalChunkResolution resolution = 5;
    HistoricalChunkProfile profile = 6;
    uint32 point_count = 7;
    uint32 object_count = 8;
    repeated deckgl.ElementMessage elements = 9;
    uint32 part_index = 10;
    uint32 part_count = 11;
    bool final_for_chunk = 12;
}
